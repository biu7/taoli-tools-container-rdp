name: docker

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build regression image
        uses: docker/build-push-action@v6
        with:
          load: true
          platforms: linux/amd64
          tags: taoli-tools-container-rdp:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run regression checks
        run: |
          sh tests/test-setup.sh
          sh tests/test-auth.sh taoli-tools-container-rdp:test
          sh tests/test-runtime.sh taoli-tools-container-rdp:test
          sh tests/test-browser-lock.sh taoli-tools-container-rdp:test
          sh tests/test-rdp-config.sh taoli-tools-container-rdp:test

      - name: Build and Push to Registries
        uses: docker/build-push-action@v6
        with:
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.event.repository.clone_url }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
